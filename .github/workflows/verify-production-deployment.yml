name: Verify production deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: https://cine-semanal.vercel.app
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Wait for and verify the automatic Vercel deployment
        run: >
          node scripts/verify-deployment.mjs
          --url=$PRODUCTION_URL
          --expected-commit=${{ github.sha }}
          --expected-ref=main
          --expected-environment=production
          --attempts=18
          --delay-ms=10000
