name: Deploy and verify production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_URL: https://cine-semanal.vercel.app
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
      VERCEL_GIT_COMMIT_REF: main
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Vercel deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Pull the production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.4.4 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build the exact release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.4.4 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy the exact source release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.4.4 deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Verify the public production alias and commit
        run: >
          node scripts/verify-deployment.mjs
          --url=$PRODUCTION_URL
          --expected-commit=${{ github.sha }}
          --expected-ref=main
          --expected-environment=production
          --attempts=18
          --delay-ms=10000
